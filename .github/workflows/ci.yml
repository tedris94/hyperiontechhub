name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DISABLE_PAYLOAD: '1'
          PAYLOAD_SECRET: 'ci-build-placeholder-secret-minimum-48-characters-long'
          DATABASE_URI: 'postgresql://ci:ci@127.0.0.1:5432/ci'

